services:
  app:
    # Built and published by .github/workflows/docker-publish.yml.
    # The server only pulls the image, so no Next.js build runs on the host.
    image: ghcr.io/farishtaenggar/website-pribadi:latest
    pull_policy: always
    container_name: website-pribadi
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-file:/data/app.db}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    volumes:
      - app_data:/data
      - app_uploads:/app/uploads
    networks:
      - edge
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

networks:
  edge:
    external: true

volumes:
  app_data:
  app_uploads:
